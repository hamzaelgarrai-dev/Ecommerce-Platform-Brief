<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section>
    <h1 class="text-amber-700 text-6xl font-bold w-full p-7">Contact</h1>
    <div class="rounded shadow p-2 bg-white"></div>   
    <header>
        <div class="Contact">
        <h1 class="text-black text-4xl font-semibold w-full  p-10">Your name:</h1>
        <input type="text" placeholder="Enter your full name here" class="border border-yellow-200 rounded-lg mx-10 py-2 px-14 outline-none focus:ring-2 focus:ring-yellow-200 bg-yellow-50"/>
        <h1 class="text-black text-4xl font-semibold w-full p-10">Your adress:</h1>
        <input type="text" placeholder="Enter your adress here" class="border border-yellow-200 rounded-lg mx-10 py-2 px-14 outline-none focus:ring-2 focus:ring-yellow-200 bg-yellow-50"/>
        <h1 class="text-black text-4xl font-semibold w-full p-10">Your email:</h1>
        <input type="text" placeholder="Enter your email here" class="border border-yellow-200 rounded-lg mx-10 py-2 px-14 outline-none focus:ring-2 focus:ring-yellow-200 bg-yellow-50"/> 
        <h1 class="text-black text-4xl font-semibold w-full p-10">Your message:</h1> 
        <textarea type="text" placeholder="You want to say something,say it here" class="border border-yellow-200 rounded-lg  mx-10 py-8 px-14 outline-none focus:ring-2 focus:ring-yellow-200 bg-yellow-50"></textarea>
        </div>
    </header>
    <button
    type="submit" class="bg-amber-900 text-while  mx-10 px-14 py-3 rounded-lg hover:bg-black transition duration-700 text-white">Send
    </button>
</section>
</body>
</html>
